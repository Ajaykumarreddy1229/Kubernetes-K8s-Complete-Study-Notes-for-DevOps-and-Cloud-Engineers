A Secret is intended for sensitive configuration such as passwords and tokens. Kubernetes Secret values encoded in data are Base64-encoded, not encrypted by Base64 itself. Configure appropriate access controls and encryption at rest for real environments.

apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  DB_USERNAME: demo-user
  DB_PASSWORD: change-me-demo



Apply:
kubectl apply -f secret.yml
kubectl get secrets
kubectl describe secret db-secret


Do not commit real passwords, tokens, or production credentials to GitHub. Use only dummy values in learning examples.
