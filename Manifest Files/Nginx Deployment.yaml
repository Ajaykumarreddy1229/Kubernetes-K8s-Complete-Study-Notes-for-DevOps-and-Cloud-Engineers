
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-headless
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-h
  template:
    metadata:
      labels:
        app: nginx-h
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
